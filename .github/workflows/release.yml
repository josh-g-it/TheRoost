name: Release Build

# Triggers when you push a version tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*.*.*"

# Allow this workflow to create GitHub Releases and upload artifacts
permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # 1. Check out the repo at the tagged commit
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js for the frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust compilation artifacts (speeds up subsequent builds significantly)
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 5. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6. Run frontend tests
      - name: Run frontend tests
        run: npx vitest run

      # 7. Run Rust tests
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

      # 8. Build the Tauri app with update signing
      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 9. Prepare release assets (rename installer, find bundle files, generate latest.json)
      - name: Prepare release assets
        shell: bash
        run: |
          NSIS_DIR="src-tauri/target/release/bundle/nsis"

          # Rename standalone installer
          INSTALLER=$(find "$NSIS_DIR" -name "*.exe" | head -1)
          cp "$INSTALLER" "$NSIS_DIR/TheRoost.exe"

          # Find the .nsis.zip and .nsis.zip.sig
          NSIS_ZIP=$(find "$NSIS_DIR" -name "*.nsis.zip" | head -1)
          NSIS_SIG=$(find "$NSIS_DIR" -name "*.nsis.zip.sig" | head -1)

          VERSION="${GITHUB_REF_NAME#v}"
          SIGNATURE=$(cat "$NSIS_SIG")
          NSIS_ZIP_NAME=$(basename "$NSIS_ZIP")

          # Generate latest.json for the Tauri updater
          cat > "$NSIS_DIR/latest.json" << EOF
          {
            "version": "$VERSION",
            "notes": "The Roost $GITHUB_REF_NAME",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/josh-g-it/TheRoost/releases/download/$GITHUB_REF_NAME/$NSIS_ZIP_NAME"
              }
            }
          }
          EOF

          # Export paths for the upload step
          echo "INSTALLER_PATH=$NSIS_DIR/TheRoost.exe" >> $GITHUB_ENV
          echo "NSIS_ZIP_PATH=$NSIS_ZIP" >> $GITHUB_ENV
          echo "NSIS_SIG_PATH=$NSIS_SIG" >> $GITHUB_ENV
          echo "LATEST_JSON_PATH=$NSIS_DIR/latest.json" >> $GITHUB_ENV

      # 10. Create draft GitHub Release with all assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "The Roost ${{ github.ref_name }}"
          body: |
            ## The Roost ${{ github.ref_name }}

            ### Auto-Update
            If you already have The Roost installed (v1.1.0+), the app will detect this update automatically. Go to **Settings > Application > Check for Updates** to install it.

            ### Fresh Install
            Download **TheRoost.exe** below and run the installer.

            ---
            *Full changelog coming soon.*
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.NSIS_ZIP_PATH }}
            ${{ env.NSIS_SIG_PATH }}
            ${{ env.LATEST_JSON_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
