name: Release Build

# Triggers when you push a version tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*.*.*"

# Allow this workflow to create GitHub Releases and upload artifacts
permissions:
  contents: write

jobs:
  build:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      # 1. Check out the repo at the tagged commit
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js for the frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Set up Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 4. Cache Rust compilation artifacts
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release

      # 5. Install frontend dependencies
      - name: Install npm dependencies
        run: npm ci

      # 6. Verify signing key is available before building
      - name: Verify signing configuration
        shell: bash
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty! Check GitHub repo Settings > Secrets."
            exit 1
          fi
          echo "Signing key is configured (${#SIGNING_KEY} chars)"
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # 7. Build the Tauri app with update signing
      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 8. Prepare release assets
      - name: Prepare release assets
        shell: bash
        run: |
          NSIS_DIR="src-tauri/target/release/bundle/nsis"

          echo "=== Files in NSIS bundle directory ==="
          ls -la "$NSIS_DIR"
          echo "==="

          # Rename standalone installer
          INSTALLER=$(find "$NSIS_DIR" -name "*.exe" | head -1)
          cp "$INSTALLER" "$NSIS_DIR/TheRoost.exe"

          # Find the .nsis.zip and .nsis.zip.sig
          NSIS_ZIP=$(find "$NSIS_DIR" -name "*.nsis.zip" | head -1)
          NSIS_SIG=$(find "$NSIS_DIR" -name "*.nsis.zip.sig" | head -1)

          if [ -z "$NSIS_ZIP" ]; then
            echo "::error::No .nsis.zip file found — signing may have failed"
            exit 1
          fi
          if [ -z "$NSIS_SIG" ]; then
            echo "::error::No .nsis.zip.sig file found — signing may have failed"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          # .sig file is already base64-encoded by Tauri — read it directly
          SIGNATURE=$(cat "$NSIS_SIG" | tr -d '\r\n')
          NSIS_ZIP_NAME=$(basename "$NSIS_ZIP")
          # Replace spaces with dots to match how GitHub Release assets are named
          NSIS_ZIP_URL_NAME=$(echo "$NSIS_ZIP_NAME" | sed 's/ /./g')
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Generate latest.json for the Tauri updater
          printf '{\n  "version": "%s",\n  "notes": "The Roost %s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": {\n      "signature": "%s",\n      "url": "https://github.com/josh-g-it/TheRoost/releases/download/%s/%s"\n    }\n  }\n}\n' \
            "$VERSION" "$GITHUB_REF_NAME" "$PUB_DATE" "$SIGNATURE" "$GITHUB_REF_NAME" "$NSIS_ZIP_URL_NAME" \
            > "$NSIS_DIR/latest.json"

          echo "Generated latest.json:"
          cat "$NSIS_DIR/latest.json"

          # Export paths for the upload step
          echo "INSTALLER_PATH=$NSIS_DIR/TheRoost.exe" >> $GITHUB_ENV
          echo "NSIS_ZIP_PATH=$NSIS_ZIP" >> $GITHUB_ENV
          echo "NSIS_SIG_PATH=$NSIS_SIG" >> $GITHUB_ENV
          echo "LATEST_JSON_PATH=$NSIS_DIR/latest.json" >> $GITHUB_ENV

      # 9. Create draft GitHub Release with all assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "The Roost ${{ github.ref_name }}"
          body: |
            ## The Roost ${{ github.ref_name }}

            ### Auto-Update
            If you already have The Roost installed (v1.1.0+), the app will detect this update automatically. Go to **Settings > Application > Check for Updates** to install it.

            ### Fresh Install
            Download **TheRoost.exe** below and run the installer.

            ---
            *Full changelog coming soon.*
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.NSIS_ZIP_PATH }}
            ${{ env.NSIS_SIG_PATH }}
            ${{ env.LATEST_JSON_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
